<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e141f"/>
      <stop offset="50%" stop-color="#172233"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66c0f4"/>
      <stop offset="100%" stop-color="#1999e3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#47b019"/>
      <stop offset="100%" stop-color="#66c0f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#66c0f4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Inner Steam Deck / Controller Silhouette -->
  <g filter="url(#shadow)" transform="translate(64, 96)">
    <!-- Main Console Body -->
    <rect x="0" y="30" width="384" height="230" rx="48" fill="#1b2838" stroke="#2d3f58" stroke-width="6"/>

    <!-- Left Grip Details / D-Pad -->
    <circle cx="68" cy="115" r="38" fill="#111722" stroke="#66c0f4" stroke-width="3"/>
    <!-- D-Pad cross -->
    <rect x="58" y="90" width="20" height="50" rx="4" fill="#66c0f4"/>
    <rect x="43" y="105" width="50" height="20" rx="4" fill="#66c0f4"/>
    <circle cx="68" cy="115" r="5" fill="#111722"/>

    <!-- Screen / Brain Area -->
    <rect x="124" y="60" width="136" height="170" rx="16" fill="#0d131c" stroke="#66c0f4" stroke-width="3"/>

    <!-- Brain Waves / Cognitive Pulse inside screen -->
    <path d="M 136 145 Q 150 110, 164 145 T 192 145 T 220 145 T 248 145" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="192" cy="110" r="14" fill="none" stroke="#66c0f4" stroke-width="4"/>
    <path d="M 192 85 L 192 92 M 172 95 L 178 100 M 212 95 L 206 100" stroke="#66c0f4" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Grip / Buttons ABXY (Steam Deck style) -->
    <circle cx="316" cy="115" r="38" fill="#111722" stroke="#66c0f4" stroke-width="3"/>
    <!-- Buttons -->
    <circle cx="316" cy="94" r="9" fill="#2d3f58"/> <!-- Y -->
    <circle cx="295" cy="115" r="9" fill="#2d3f58"/> <!-- X -->
    <circle cx="337" cy="115" r="9" fill="#c23b3b"/> <!-- B -->
    <circle cx="316" cy="136" r="9" fill="#47b019"/> <!-- A -->

    <!-- Steam Menu & Quick Access buttons -->
    <rect x="48" y="195" width="40" height="12" rx="6" fill="#2a3f5a"/>
    <rect x="296" y="195" width="40" height="12" rx="6" fill="#2a3f5a"/>
  </g>

  <!-- Typography: WINEBOX -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="6">WINEBOX</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#66c0f4" text-anchor="middle" letter-spacing="3">COGNITIVE CONSOLE</text>
</svg>
